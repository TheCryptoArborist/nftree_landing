name: NFTree TradePort Sales Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nftree-tradeport-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query TradePort collection activity
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(python - <<'PY'
          import re
          s=open('netlify/functions/nftree-listings.mjs').read()
          m=re.search(r'"x-api-key"\s*:\s*"([^"]+)"', s)
          if not m: raise SystemExit('API key not found')
          print(m.group(1))
          PY
          )
          cat > /tmp/query.json <<'JSON'
          {
            "query": "query NFTreeAudit($id: uuid!, $limit: Int!) { sui { collections(where: {id: {_eq: $id}}) { id slug semantic_slug title supply volume usd_volume } recent_actions(where: {collection_id: {_eq: $id}}, order_by: [{block_time: asc}, {tx_index: asc}], limit: $limit) { id type price usd_price sender receiver tx_id block_time market_name bought_on_tradeport nft { id token_id name owner } } } }",
            "variables": {"id": "c9e46101-b0d0-4251-8731-212792288300", "limit": 5000}
          }
          JSON
          curl --fail-with-body -sS https://graphql.tradeport.gg \
            -H 'content-type: application/json' \
            -H "x-api-key: $KEY" \
            -H 'x-api-user: tradeport.xyz' \
            --data-binary @/tmp/query.json > tradeport-audit-raw.json
          python - <<'PY'
          import json
          p=json.load(open('tradeport-audit-raw.json'))
          out={'errors':p.get('errors')}
          sui=(p.get('data') or {}).get('sui') or {}
          acts=sui.get('recent_actions') or []
          sales=[a for a in acts if str(a.get('type','')).lower()=='sale']
          tp=[a for a in sales if a.get('bought_on_tradeport') is True]
          out['collection']=sui.get('collections')
          out['activity_count']=len(acts)
          out['sale_count_all_markets']=len(sales)
          out['sale_count_bought_on_tradeport']=len(tp)
          out['market_counts']={}
          for a in sales:
              k=str(a.get('market_name') or 'unknown')
              out['market_counts'][k]=out['market_counts'].get(k,0)+1
          out['tradeport_sales']=tp
          json.dump(out,open('tradeport-audit-summary.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nftree-tradeport-audit
          path: |
            tradeport-audit-summary.json
            tradeport-audit-raw.json
