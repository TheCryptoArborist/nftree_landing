<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden Bot Mobile Result Screen Fixture — No Wallet</title>
<link rel="stylesheet" href="/battle/assets/index-trdY-Mq5.css">
<link rel="stylesheet" href="/battle/assets/garden-bot-preview-onboarding.css">
<link rel="stylesheet" href="/battle/assets/garden-bot-preview-compact-game.css">
<link rel="stylesheet" href="/battle/assets/garden-bot-preview-mobile-polish.css">
<style>html,body{margin:0;background:#041810;color:#fff;font-family:Orbitron,Arial,sans-serif;min-height:100%}</style>
</head>
<body>
<div class="gb-result-modal-backdrop">
 <section class="gb-result-modal" role="dialog" aria-modal="true" aria-labelledby="gb-result-modal-title">
  <button type="button" class="gb-result-modal-close" aria-label="Close battle result">X</button>
  <div class="gb-result-modal-visual">
   <div class="gb-result-modal-image-wrap"><img class="gb-result-modal-image" alt="Sample stage illustration, not unique NFT artwork" src="/battle/assets/battle-trees/player-stage-4.png"></div>
   <p class="gb-result-modal-score-card">Final score: 50–38</p>
  </div>
  <div class="gb-result-modal-copy">
   <p class="gb-result-modal-kicker">Battle Complete</p>
   <h2 id="gb-result-modal-title">You Win!</h2>
   <p class="gb-result-modal-summary">Your Garden Bot match is complete.</p>
   <section class="gb-result-share-picker" aria-labelledby="gb-result-share-title">
    <div class="gb-result-share-heading"><div><p class="gb-result-share-kicker">Choose Your Message</p><h3 id="gb-result-share-title">Share the battle your way</h3></div><span>1 of 3 selected</span></div>
    <div class="gb-result-share-options">
     <button type="button" class="is-selected" aria-pressed="true"><strong>Victory</strong></button>
     <button type="button" aria-pressed="false"><strong>Challenge</strong></button>
     <button type="button" aria-pressed="false"><strong>Leaderboard</strong></button>
    </div>
    <p class="gb-result-share-preview">I won Garden Battles 50–38! Think your NFTree can beat mine?</p>
   </section>
   <div class="gb-result-modal-actions gb-result-share-actions">
    <button type="button" class="gb-result-share-primary">Share to Apps <small>Instagram, Facebook &amp; more</small></button>
    <a href="#">Text Message</a>
    <a href="#">Share on X</a>
    <a href="#">Facebook</a>
    <button type="button">Copy Caption</button>
   </div>
   <div class="gb-result-next-actions"><button type="button">Play Again</button><a href="#">View Leaderboard</a></div>
  </div>
 </section>
</div>
</body>
</html>
