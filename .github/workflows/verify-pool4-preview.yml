name: Verify NFTree Pool 4 deploy preview

on:
  push:
    branches:
      - fix/pool4-package-20260913

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pool4-package-20260913
          fetch-depth: 0

      - name: Verify preview homepage, API, and mint-page configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://deploy-preview-5--treenft.netlify.app"
          new_package = "0x79459345a7abde29c4763c97c65f8f48b9e9878dc077ea7ab57c0ad7d585c736"
          pool4 = "0xfa7b71037b2a8a6bbe36b6cfbccca629f698c767aeb9dad603a0c655adf4de2a"
          expected = {"Pool 1": 1072, "Pool 2": 863, "Pool 3": 900, "Pool 4": 680}

          def get(path):
              last = None
              for attempt in range(18):
                  request = urllib.request.Request(
                      f"{base}{path}",
                      headers={"User-Agent": "NFTree-deployment-verifier/1.0", "Cache-Control": "no-cache"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = response.read()
                          if response.status != 200:
                              raise RuntimeError(f"{path} returned {response.status}")
                          return body
                  except Exception as error:
                      last = error
                      time.sleep(min(3 + attempt, 12))
              raise RuntimeError(f"{path} was not ready: {last}")

          homepage = get("/?pool4-verify=1")
          if b"NFTree" not in homepage:
              raise AssertionError("Preview homepage did not contain NFTree content")

          payload = json.loads(get("/api/nftree-sale-pools?pool4-verify=1"))
          if payload.get("latestPackageId") != new_package:
              raise AssertionError(f"Wrong latestPackageId: {payload.get('latestPackageId')}")
          pools = payload.get("pools") or []
          if len(pools) != 4:
              raise AssertionError(f"Expected 4 pools, received {len(pools)}")
          by_label = {pool.get("label"): pool for pool in pools}
          for label, count in expected.items():
              actual = by_label.get(label, {}).get("count")
              if actual != count:
                  raise AssertionError(f"{label} count expected {count}, received {actual}")
          if by_label.get("Pool 4", {}).get("poolId") != pool4:
              raise AssertionError("Pool 4 ID is incorrect")
          if payload.get("totalAvailable") != 3515:
              raise AssertionError(f"Expected totalAvailable 3515, received {payload.get('totalAvailable')}")

          app = get("/app.js?pool4-verify=1").decode("utf-8", "replace")
          if "/api/nftree-sale-pools" not in app:
              raise AssertionError("Mint page is not reading the sale-pool API")
          if new_package not in app or pool4 not in app:
              raise AssertionError("Mint page fallback is missing the current package or Pool 4")

          print(json.dumps({
              "homepageStatus": 200,
              "latestPackageId": payload["latestPackageId"],
              "totalAvailable": payload["totalAvailable"],
              "poolCounts": {label: by_label[label]["count"] for label in expected},
              "pool4Id": by_label["Pool 4"]["poolId"],
              "mintPageReadsSalePoolApi": True,
          }, indent=2))
          PY

      - name: Remove one-time preview verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git rm .github/workflows/verify-pool4-preview.yml
          git commit -m "chore: remove one-time Pool 4 preview verifier"
          git push origin HEAD:fix/pool4-package-20260913
