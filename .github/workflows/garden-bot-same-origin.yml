name: Same-origin Garden Bot preview checks
on:
  push:
    branches:
      - feature/garden-bot-same-origin-preview-20261109
  pull_request:
    paths:
      - "public/battle/**"
      - "netlify.toml"
      - "test/garden-bot-same-origin-preview.test.mjs"
      - "scripts/qa-garden-bot-same-origin.mjs"
      - "scripts/qa-garden-bot-active-viewport.mjs"
      - "scripts/qa-garden-bot-compact-viewport.mjs"
      - "test/garden-bot-compact-viewport.test.mjs"
      - "test/garden-bot-mobile-polish.test.mjs"
      - "scripts/qa-garden-bot-mobile-polish.mjs"
      - "scripts/qa-garden-bot-mobile-ranks.mjs"
      - "scripts/qa-garden-bot-social-card.mjs"
      - "scripts/qa-pvp-mobile.mjs"
      - "scripts/pvp-mobile-patches.mjs"
      - "scripts/build-pvp-mobile-preview.mjs"
      - "test/pvp-mobile-preview.test.mjs"
      - "test/garden-bot-mobile-ranks.test.mjs"
      - ".github/workflows/garden-bot-same-origin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check preview-only browser bundle syntax
        run: node --check public/battle/assets/garden-bot-same-origin-preview.js
      - name: Run full NFTree tests
        run: npm test
      - name: Lint NFTree app and functions
        run: npm run lint
      - name: Build complete NFTree site without publishing
        run: npm run build
      - name: Ensure existing NFTree routes and functions remain
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/r/mischief-finance/index.html
          test -f netlify/functions/nftree-listings.mjs
          test -f netlify/functions/nftree-sale-pools.mjs
          test -f public/battle/index.html
          test -f public/battle/trials/index.html
          test -f public/battle/leaderboard/index.html
          test -f public/battle/garden-bot-preview/index.html
          test -f public/battle/assets/garden-bot-same-origin-preview.js
      - name: Install browser for static preview test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify same-origin Garden Bot route in mobile Chromium
        run: node scripts/qa-garden-bot-same-origin.mjs
      - name: Verify all five cards and both Growth meters fit phone viewports
        run: node scripts/qa-garden-bot-compact-viewport.mjs
      - name: Validate all five active-match cards inside phone viewport
        run: node scripts/qa-garden-bot-active-viewport.mjs
      - name: Validate mobile controls and final result/share dialog at four widths
        run: node scripts/qa-garden-bot-mobile-polish.mjs
      - name: Verify mobile rank cards and LP breakdown at five widths
        run: node scripts/qa-garden-bot-mobile-ranks.mjs
      - name: Verify actual result card rendering and share behavior at four phone sizes
        run: node scripts/qa-garden-bot-social-card.mjs
      - name: Verify isolated PvP mobile UI with simulated wallet callbacks
        run: node scripts/qa-pvp-mobile.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-bot-same-origin-screenshots
          path: |
            qa-garden-bot-preview/
            qa-garden-bot-compact/
            qa-garden-bot-polish/
            qa-garden-bot-ranks/
            qa-garden-bot-social/
            qa-pvp-mobile/
          if-no-files-found: warn
