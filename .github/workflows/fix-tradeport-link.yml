name: Finalize TradePort browse link

on:
  push:
    branches:
      - feature/sale-pool-rarity-summary

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sale-pool-rarity-summary
          fetch-depth: 0

      - name: Point the compact browse button to TradePort
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text()
          old = '<a class="button button-secondary" href="#listingGrid">Browse on TradePort</a>'
          new = '<a class="button button-secondary" href="https://www.tradeport.xyz/sui/collection/0xf6c6d439ea0da2f3e9ba79e4992a7a4c113215fbf54c442ac9020c315f953705::collection::NFT?tab=items" rel="noreferrer" target="_blank">Browse on TradePort</a>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one TradePort browse link, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-tradeport-link.yml
          git diff --check
          ! git diff --name-only | grep -q '^public/battle/'

      - name: Commit
        shell: bash
        run: |
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add public/index.html
          git commit -m "Link compact listing card directly to TradePort"
          git push origin HEAD:feature/sale-pool-rarity-summary
