name: Apply sale-pool inventory simplification

on:
  push:
    branches:
      - feature/sale-pool-rarity-summary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sale-pool-rarity-summary
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply integrated implementation
        run: node .github/scripts/apply-sale-pool-simplification.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate
        shell: bash
        run: |
          npm test
          npm run lint
          npm run build
          git diff --check
          test ! -e public/sale-pool-rarity-summary.js
          test ! -e public/sale-pool-rarity-summary.css
          test ! -e .github/workflows/apply-sale-pool-simplification.yml
          test ! -e .github/scripts/apply-sale-pool-simplification.mjs
          ! grep -R "A 5% commission will be recorded" public/app.js public/index.html
          ! grep -R "renderSalePoolCard" public/app.js
          if git diff --name-only | grep -q '^public/battle/'; then
            echo 'Garden Battles files changed unexpectedly.' >&2
            exit 1
          fi

      - name: Commit integrated implementation
        shell: bash
        run: |
          git config user.name "TheCryptoArborist"
          git config user.email "190985450+TheCryptoArborist@users.noreply.github.com"
          git add public/app.js public/index.html public/styles.css
          git add -u public/sale-pool-rarity-summary.js public/sale-pool-rarity-summary.css
          git add -u .github/workflows/apply-sale-pool-simplification.yml .github/scripts/apply-sale-pool-simplification.mjs
          git commit -m "Simplify sale-pool inventory display"
          git push origin HEAD:feature/sale-pool-rarity-summary
